<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Food Bank</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- Shared dashboard. The tiles come from Nancy's GET /api/reports/dashboard. -->
  <main class="page">
    <header class="page-head"><h1>Dashboard</h1></header>
    <p id="msg" class="message" hidden></p>
    <section class="card"><h2>Expiry alerts</h2><div id="alertTiles" class="tiles"></div><a href="alerts.html">Go to alerts</a></section>
    <section class="card"><h2>Stock</h2><div id="stockTiles" class="tiles"></div></section>
    <section class="card"><h2>Last 7 days</h2><div id="weekTiles" class="tiles"></div></section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
